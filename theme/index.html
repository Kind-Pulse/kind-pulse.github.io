<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#121212">
<title>Shared theme · KindPulse</title>
<!--
  KindPulse THEME page: https://kind-pulse.github.io/theme/#<payload>
  ONE static file, no build step, no external requests. With KindPulse
  installed, Android opens these links straight in the app (a verified App
  Link, android/app/src/main/AndroidManifest.xml); this page shows only when
  it is not, or when the link is opened elsewhere.

  The theme travels in the URL FRAGMENT, which never reaches any server:
  base64url (no padding) of UTF-8 JSON {"v":1,"n":<name>,"c":<colours>}, the
  colours comma-separated RRGGBB in the fixed order bg, surface, border,
  text, accent, heart, flame, danger, trophy (an empty trophy = gold).
  THE SAME FORMAT AS lib/sync/theme_link.dart + kpDecodeThemeLink
  (lib/src/theme.dart) — change them together, and never change a key or
  the order without bumping v.
-->
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #ffffff;
    --soft: rgba(255, 255, 255, 0.70);
    --line: rgba(255, 255, 255, 0.12);
    --fill: rgba(255, 255, 255, 0.05);
    --accent: #40b3dd;
    --on-accent: #06222c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f6f6;
      --card: #ffffff;
      --text: #1a1a1a;
      --soft: rgba(26, 26, 26, 0.70);
      --line: rgba(0, 0, 0, 0.12);
      --fill: rgba(0, 0, 0, 0.04);
      --accent: #0b8fc0;
      --on-accent: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 480px; }
  .brand { color: var(--soft); font-size: 14px; font-weight: 500; margin: 0 4px 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 20px 20px;
  }
  .kicker { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 6px; }
  h1 { font-size: 24px; line-height: 1.25; font-weight: 600; margin: 0 0 16px; overflow-wrap: anywhere; }
  p.body { color: var(--soft); margin: 0; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 52px; padding: 0 20px; border-radius: 999px;
    font: inherit; font-size: 16px; font-weight: 600; text-decoration: none;
    border: 1px solid var(--line); background: var(--fill); color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hint { color: var(--soft); font-size: 14px; text-align: center; margin: 2px 8px 0; }

  /* The preview: drawn ONLY in the shared theme's colours (set by script). */
  .preview {
    border-radius: 16px; padding: 14px;
    background: var(--t-bg); border: 1px solid var(--line);
  }
  .t-card {
    background: var(--t-surface); border: 1px solid var(--t-border);
    border-radius: 12px; padding: 12px 14px; color: var(--t-text);
  }
  .t-row { display: flex; align-items: center; gap: 10px; }
  .t-row + .t-row { margin-top: 10px; }
  .t-title { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .t-soft { opacity: 0.7; font-size: 14px; flex: 1; }
  .t-today {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: var(--t-accent); color: var(--t-on-accent);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .t-btn {
    border-radius: 10px; padding: 6px 14px; font-size: 14px; font-weight: 600;
    background: var(--t-surface); color: var(--t-text); border: 1px solid var(--t-border);
  }
  .t-danger { color: var(--t-danger); font-size: 14px; font-weight: 600; }
  .t-icons { display: flex; gap: 8px; align-items: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">KindPulse</div>

  <div class="card" id="theme" hidden>
    <p class="kicker">A theme for KindPulse</p>
    <h1 id="name"></h1>
    <div class="preview" id="preview" aria-label="Preview of the theme">
      <div class="t-card">
        <div class="t-row">
          <div class="t-today">17</div>
          <div class="t-title" id="preview-name"></div>
          <div class="t-icons">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--t-heart)" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--t-flame)" d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.4 1.2-4.1 2.4-5.4.2 1.6.9 2.7 2 3.2C11 8 11.3 4.8 12 2z"/></svg>
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path id="trophy" d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm0 4H6v1a2 2 0 0 0 1 1.7V7zm11 0h-1v2.7A2 2 0 0 0 18 8V7z"/></svg>
          </div>
        </div>
        <div class="t-row">
          <div class="t-soft">Call Grandma</div>
          <div class="t-btn">Done</div>
        </div>
        <div class="t-row">
          <div class="t-soft"></div>
          <div class="t-danger">Delete</div>
        </div>
      </div>
    </div>
    <div class="actions">
      <a class="btn primary" id="open-app" hidden>Open in KindPulse</a>
      <a class="btn" id="get-app" href="https://play.google.com/store/apps/details?id=com.kindpulse.app">Get KindPulse on Google Play</a>
      <p class="hint" id="android-hint" hidden>KindPulse is an Android app. Open this link on your Android phone to add the theme.</p>
    </div>
  </div>

  <div class="card" id="broken" hidden>
    <h1>This theme link is incomplete.</h1>
    <p class="body">Ask for the theme to be shared again.</p>
    <div class="actions">
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.kindpulse.app">Get KindPulse on Google Play</a>
    </div>
  </div>
</main>
<script>
(function () {
  'use strict';
  var PACKAGE = 'com.kindpulse.app';
  var PLAY = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
  var VERSION = 1;          // kThemeLinkVersion
  var NAME_MAX = 40;        // kUserThemeNameMax
  var MAX_CHARS = 2000;     // kThemeLinkMaxPayloadChars
  // kKpThemeLinkColorOrder — NEVER reorder without bumping VERSION.
  var ORDER = ['bg', 'surface', 'border', 'text', 'accent', 'heart', 'flame', 'danger', 'trophy'];

  function $(id) { return document.getElementById(id); }

  // base64url (standard base64 and padding tolerated) → UTF-8 text.
  function b64urlToText(s) {
    s = s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  }

  // The same checks as the app: v, a 1–40 character name with no control
  // characters, nine colours (RRGGBB, '#' optional), only the trophy empty.
  // Returns {name, colors: {bg: '#RRGGBB', …, trophy: null}} or null.
  function decode(payload) {
    try {
      var p = (payload || '').trim();
      if (!p || p.length > MAX_CHARS) return null;
      var m = JSON.parse(b64urlToText(p));
      if (!m || typeof m !== 'object' || Array.isArray(m)) return null;
      if (typeof m.v !== 'number' || !Number.isInteger(m.v) || m.v < 1 || m.v > VERSION) return null;
      if (typeof m.n !== 'string' || typeof m.c !== 'string') return null;
      var name = m.n.trim();
      if (!name || name.length > NAME_MAX || /[\u0000-\u001f\u007f]/.test(name)) return null;
      var parts = m.c.split(',');
      if (parts.length !== ORDER.length) return null;
      var colors = {};
      for (var i = 0; i < ORDER.length; i++) {
        var raw = parts[i].trim();
        if (ORDER[i] === 'trophy' && raw === '') { colors.trophy = null; continue; }
        var hex = /^#?([0-9a-fA-F]{6})$/.exec(raw);
        if (!hex) return null;
        colors[ORDER[i]] = '#' + hex[1].toUpperCase();
      }
      return { name: name, colors: colors };
    } catch (e) {
      return null;
    }
  }

  function lum(hex) {
    var n = parseInt(hex.slice(1), 16);
    function ch(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * ch((n >> 16) & 255) + 0.7152 * ch((n >> 8) & 255) + 0.0722 * ch(n & 255);
  }

  function render(t, payload) {
    document.title = t.name + ' · KindPulse theme';
    $('name').textContent = t.name;
    $('preview-name').textContent = t.name;
    var s = $('preview').style;
    var c = t.colors;
    s.setProperty('--t-bg', c.bg);
    s.setProperty('--t-surface', c.surface);
    s.setProperty('--t-border', c.border);
    s.setProperty('--t-text', c.text);
    s.setProperty('--t-accent', c.accent);
    s.setProperty('--t-on-accent', lum(c.accent) > 0.4 ? '#000000' : '#ffffff');
    s.setProperty('--t-heart', c.heart);
    s.setProperty('--t-flame', c.flame);
    s.setProperty('--t-danger', c.danger);
    $('trophy').setAttribute('fill', c.trophy || '#E0A824'); // no colour = gold

    if (/Android/i.test(navigator.userAgent)) {
      var a = $('open-app');
      a.href = 'intent://theme/' + payload + '#Intent;scheme=kindpulse;package=' + PACKAGE +
        ';S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
      a.hidden = false;
    } else {
      $('android-hint').hidden = false;
    }
    $('theme').hidden = false;
  }

  function start() {
    var payload = (location.hash || '').replace(/^#/, '').trim();
    var t = decode(payload);
    if (!t) { $('broken').hidden = false; return; }
    render(t, payload);
  }

  // Exposed for tests (tool-free: node can read this script and call it).
  window.kpDecodeThemeLink = decode;
  window.addEventListener('hashchange', function () { location.reload(); });
  start();
})();
</script>
</body>
</html>
