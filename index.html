<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KindPulse</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --text: #1a1a1a; --soft: #5f6368; --accent: #0b8fc0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --text: #ffffff; --soft: #a0a0a0; --accent: #26b3e7; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: var(--soft); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>KindPulse Calendar</h1>
  <p>A local-first calendar and to-do app for Android that helps you stay in touch with the people who matter.</p>
  <p><a href="https://kind-pulse.github.io/privacy-policy/kind-pulse/">Privacy policy</a></p>
</main>
</body>
</html>
